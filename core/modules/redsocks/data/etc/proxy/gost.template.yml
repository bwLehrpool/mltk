services:
  - name: redir-0
    addr: ":12345"
    handler:
      type: red
      chain: chain-0
      metadata:
        sniffing: true
        sniffing.fallback: true
    listener:
      type: red

chains:
  - name: chain-0
    hops:
      - name: hop-0
        nodes:
          - name: node-0
            addr: "%PROXY_IP%:%PROXY_PORT%"
            connector:
              type: %PROXY_TYPE%
            dialer:
              type: tcp

