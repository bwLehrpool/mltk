global
    log /dev/log local0
    maxconn 4096

defaults
    log global
    mode http
    option httplog
    timeout connect 4s
    timeout client  60s
    timeout server  60s

frontend transparent_http
    bind 127.0.0.1:12346
    bind [::1]:12346

    # Require a Host header.
    acl has_host req.hdr(Host) -m found
    http-request deny unless has_host

    # Convert origin-form into absolute-form.
    http-request set-uri http://%[req.hdr(Host)]%[pathq] if { path -m beg / }

    # Don't allow CONNECT through this HTTP-only service.
    http-request deny if { method CONNECT }

    default_backend squid

backend squid
    server squid1 %PROXY_IP%:%PROXY_PORT%

